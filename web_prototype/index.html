<title>에테르 원정대 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-screen 3D stage with DOM HUD on top; portrait-first, touch joystick. */
:root {
  --bg: #0d1418;

html, body { height: 100%; }
body {

  margin: 0; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#hud { position: absolute; inset: 0; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); }
.bar { height: 10px; background: rgba(0,0,0,.55); }
.bar > i { display: block; height: 100%; width: 0; background: var(--xp); }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-top: 8px; }
.hp { width: min(46vw, 240px); height: 14px; background: rgba(0,0,0,.55); border-radius: 7px; overflow: hidden; }
.hp > i { display: block; height: 100%; width: 100%; background: var(--hp); }
.wv { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.wbar { width: min(40vw, 180px); height: 10px; background: rgba(0,0,0,.55); border-radius: 5px; overflow: hidden; }
.wbar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#banner { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-size: clamp(30px, 9vw, 52px); font-weight: 800; letter-spacing: .04em;
  text-shadow: 0 2px 8px #000; pointer-events: none; opacity: 0; transition: opacity .35s; padding: 0 16px; }
.info { font-size: 14px; margin-top: 6px; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.timer { font-size: 22px; font-weight: 700; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
#joyBase, #joyKnob { position: absolute; border-radius: 50%; display: none; }
#joyBase { width: 140px; height: 140px; margin: -70px 0 0 -70px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); }
#joyKnob { width: 56px; height: 56px; margin: -28px 0 0 -28px; background: rgba(255,255,255,.5); }
#hint { position: absolute; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 14px; color: var(--muted); text-shadow: 0 1px 2px #000; transition: opacity .6s; }
#overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(5,9,12,.78); padding: 20px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
#overlay h2 { margin: 0; font-size: clamp(22px, 6vw, 30px); text-wrap: balance; text-align: center; }
#overlay p { margin: 0; color: var(--muted); text-align: center; line-height: 1.6; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(100%, 640px); }
.card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc, var(--line)); border-radius: 12px;
  padding: 12px 6px 14px; color: var(--fg); font: inherit; cursor: pointer; }
.card.act { --tc: var(--accent); }
.card.pas { --tc: var(--xp); }
.card:active { background: #213039; transform: scale(.98); }
.card .ic { width: 68px; height: 68px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2b3d48, #131d23); display: grid; place-items: center; }
.card .ic svg { width: 60px; height: 60px; display: block; }
.card .k { font-size: 11px; letter-spacing: .06em; color: var(--tc, var(--muted)); }
.card .n { font-size: 15px; font-weight: 700; text-wrap: balance; word-break: keep-all; }
.card .pips { display: flex; gap: 3px; }
.card .pips i { width: 8px; height: 8px; border-radius: 50%; background: #34464f; }
.card .pips i.on { background: var(--accent); }
.card .pips i.nx { background: transparent; box-shadow: 0 0 0 2px var(--accent) inset; animation: nx 1s ease-in-out infinite alternate; }
@keyframes nx { to { opacity: .35; } }
.card .d { font-size: 12.5px; color: var(--muted); line-height: 1.45; word-break: keep-all; }
@media (min-width: 520px) { .card .ic { width: 88px; height: 88px; } .card .ic svg { width: 78px; height: 78px; } .card .n { font-size: 17px; } .card .d { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { .card .pips i.nx { animation: none; } }
.btn { background: var(--accent); color: #231a00; border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 17px; padding: 14px 28px; cursor: pointer; }
#err { position: absolute; left: 16px; right: 16px; top: 80px; color: #ff9a8a; font-size: 13px; }

              var t = tmpB[Math.min(i, tmpB.length - 1)];
              var dx = t.x - h.x, dz = t.z - h.z, l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
              if (i >= tmpB.length) { var an = (i % 2 ? -1 : 1) * 10 * Math.PI / 180 * (i - tmpB.length + 1), c = Math.cos(an), s = Math.sin(an); var rx = dx * c - dz * s, rz = dx * s + dz * c; dx = rx; dz = rz; }
              k.bolts.push({ x: h.x, z: h.z, dx: dx, dz: dz, life: 12 / 14 + 0.3, dmg: BOLT.dmg[k.lvl - 1] * st.dmg, pierce: BOLT.pierce[k.lvl - 1], hit: [] });
            }
            k.timer = BOLT.cd[k.lvl - 1];
          }
        }
        for (var bi = k.bolts.length - 1; bi >= 0; bi--) {
          var b = k.bolts[bi];
          b.x += b.dx * 14 * dt; b.z += b.dz * 14 * dt; b.life -= dt;
          queryCircle(b.x, b.z, 0.25, tmpB);
          for (var q = 0; q < tmpB.length && b.pierce > 0; q++) {
            if (b.hit.indexOf(tmpB[q]) >= 0) continue;
            b.hit.push(tmpB[q]); damage(tmpB[q], b.dmg); b.pierce--;
          }
          if (b.pierce <= 0 || b.life <= 0) k.bolts.splice(bi, 1);
        }
      } else if (k.id === 'orbit') {
        G.orbitAngle += 200 * dt;
        var cnt = ORBIT.count[k.lvl - 1];
        for (var i2 = 0; i2 < cnt; i2++) {
          var a = (G.orbitAngle + 360 * i2 / cnt) * Math.PI / 180;
          var bx = h.x + Math.cos(a) * ORBIT_R, bz = h.z + Math.sin(a) * ORBIT_R;
          k.blades = k.blades || [];
          k.blades[i2] = { x: bx, z: bz, a: a };
          queryCircle(bx, bz, 0.9, tmpB);
          for (var q2 = 0; q2 < tmpB.length; q2++) {
            var nx2 = G.orbitHit.get(tmpB[q2]);
            if (nx2 !== undefined && now < nx2) continue;
            G.orbitHit.set(tmpB[q2], now + 0.4);
            damage(tmpB[q2], ORBIT.dmg[k.lvl - 1] * st.dmg);
          }
        }
      } else if (k.id === 'pulse') {
        G.pulseT -= dt * st.spd;
        if (G.pulseT <= 0) {
          G.pulseT = PULSE.interval[k.lvl - 1];
          var r = PULSE.radius[k.lvl - 1];
          queryCircle(h.x, h.z, r, tmpB);
          for (var q3 = 0; q3 < tmpB.length; q3++) damage(tmpB[q3], PULSE.dmg[k.lvl - 1] * st.dmg);
          pulseMesh.scale.set(r, 1, r); G.pulseFlash = 0.18;
        }
      }
    });
    if (G.pulseFlash > 0) G.pulseFlash -= dt;
  }

  function gemTick(dt) {
    var h = G.hero, mg = G.st.magnet;
    for (var i = G.gems.length - 1; i >= 0; i--) {
      var g = G.gems[i], dx = h.x - g.x, dz = h.z - g.z, d = Math.hypot(dx, dz);
      if (d < mg) g.att = true;
      if (g.att && d > 0.001) { var sp = 10 + 8 * Math.max(0, Math.min(1, 1 - d / mg)); g.x += dx / d * sp * dt; g.z += dz / d * sp * dt; }
      if (d < 0.6) { G.gems.splice(i, 1); addExp(g.v); }
    }
  }

  function addExp(v) {
    G.exp += v;
    while (G.exp >= expReq(G.level)) { G.exp -= expReq(G.level); G.level++; G.pending++; }
    if (G.pending > 0 && G.phase === 'play') openLevelUp();
  }

  function rollChoices() {
    var act = 0, pas = 0;
    G.skills.forEach(function (k) { if (SKILLS[k.id].active) act++; else pas++; });
    var pool = SKILL_IDS.filter(function (id) {
      var k = skillOf(id);
      if (k) return k.lvl < SKILLS[id].txt.length;
      return SKILLS[id].active ? act < CFG.maxActive : pas < CFG.maxPassive;
    });
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    var picks = pool.slice(0, 3);
    if (picks.length && !picks.some(function (id) { return SKILLS[id].active; })) {
      var atk = pool.slice(3).filter(function (id) { return SKILLS[id].active; });
      if (atk.length) picks[picks.length - 1] = atk[0];
    }
    return picks.length ? picks : ['heal'];
  }

  var overlay = document.getElementById('overlay');
  function openLevelUp() {
    G.phase = 'level'; G.choices = rollChoices(); renderCards();
  }
  var ICONS = {
    bolt: '<svg viewBox="0 0 64 64"><defs><radialGradient id="gb"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffd84d"/><stop offset="1" stop-color="#ffb000"/></radialGradient></defs><path d="M6 58 L30 34" stroke="#ffd84d" stroke-width="7" stroke-linecap="round" opacity=".35"/><path d="M12 52 L30 34" stroke="#ffd84d" stroke-width="4" stroke-linecap="round" opacity=".6"/><circle cx="40" cy="24" r="14" fill="url(#gb)"/><circle cx="36" cy="20" r="4" fill="#fff" opacity=".8"/></svg>',
    orbit: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="21" fill="none" stroke="#99e6ff" stroke-width="2" stroke-dasharray="3 5" opacity=".7"/><circle cx="32" cy="32" r="6" fill="#4d73d9"/><g fill="#99e6ff" stroke="#e8fbff" stroke-width="1.5"><path d="M32 3 L37 14 L32 21 L27 14Z"/><path d="M32 61 L27 50 L32 43 L37 50Z"/><path d="M3 32 L14 27 L21 32 L14 37Z" opacity=".7"/></g></svg>',
    pulse: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#fff2a0" stroke-width="2.5" opacity=".35"/><circle cx="32" cy="32" r="19" fill="none" stroke="#fff2a0" stroke-width="3" opacity=".65"/><circle cx="32" cy="32" r="10" fill="none" stroke="#fff2a0" stroke-width="3.5"/><circle cx="32" cy="32" r="4" fill="#fffbe0"/></svg>',
    might: '<svg viewBox="0 0 64 64"><path d="M32 4 L39 38 L32 46 L25 38Z" fill="#e8ecf5" stroke="#9aa6c0" stroke-width="1.5"/><rect x="20" y="40" width="24" height="6" rx="2" fill="#e0b84a"/><rect x="29" y="46" width="6" height="12" rx="2" fill="#8a5a2b"/><path d="M50 8 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ff6a5a"/></svg>',
    haste: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#6fe0b0" stroke-width="3" opacity=".5"/><polygon points="36,6 16,36 29,36 25,58 48,26 34,26" fill="#6fe0b0" stroke="#d6fff0" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    boots: '<svg viewBox="0 0 64 64"><path d="M20 8 H38 V30 L54 38 Q58 40 58 46 V54 H14 V8Z" fill="#c98a4a" stroke="#7a4d22" stroke-width="2" stroke-linejoin="round"/><rect x="14" y="48" width="44" height="7" fill="#7a4d22"/><path d="M4 22 H14 M2 32 H14 M6 42 H14" stroke="#bfefff" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg>',
    magnet: '<svg viewBox="0 0 64 64"><path d="M16 12 V32 A16 16 0 0 0 48 32 V12" fill="none" stroke="#ff5a5a" stroke-width="11"/><rect x="10.5" y="6" width="11" height="12" fill="#eef2f8"/><rect x="42.5" y="6" width="11" height="12" fill="#eef2f8"/><path d="M26 4 l-3 6 M32 2 v7 M38 4 l3 6" stroke="#5ad8ff" stroke-width="2.5" stroke-linecap="round"/></svg>',
    vital: '<svg viewBox="0 0 64 64"><path d="M32 56 C6 38 6 14 21 12 C27 11.5 32 16 32 21 C32 16 37 11.5 43 12 C58 14 58 38 32 56Z" fill="#ff6b8a" stroke="#ffd0da" stroke-width="2"/><path d="M18 20 q4 -4 9 -1" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></svg>',
    heal: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#2b8a5a"/><path d="M26 14 H38 V26 H50 V38 H38 V50 H26 V38 H14 V26 H26Z" fill="#eafff3"/></svg>'
  };

  function renderCards() {
    overlay.innerHTML = '';
    var h2 = document.createElement('h2'); h2.textContent = '레벨 업!  스킬을 선택하세요'; overlay.appendChild(h2);
    var wrap = document.createElement('div'); wrap.className = 'cards';
    G.choices.forEach(function (id) {
      var def = SKILLS[id], k = skillOf(id), cur = k ? k.lvl : 0, max = def.txt.length, next = Math.min(max, cur + 1);
      var pips = '';
      if (id !== 'heal') for (var p = 1; p <= max; p++) pips += '<i class="' + (p <= cur ? 'on' : (p === next ? 'nx' : '')) + '"></i>';
      var b = document.createElement('button'); b.className = 'card ' + (def.active ? 'act' : 'pas');
      b.innerHTML = '<div class="ic">' + ICONS[id] + '</div><div class="k">' + (id === 'heal' ? '&nbsp;' : (def.active ? '액티브' : '패시브')) + '</div>' +
        '<div class="n">' + def.name + '</div><div class="pips">' + pips + '</div>' +
        '<div class="d">' + (cur === 0 ? '<b>NEW</b> ' : 'Lv.' + next + ' ') + def.txt[next - 1] + '</div>';
      b.addEventListener('click', function () { pick(id); });
      wrap.appendChild(b);
    });
    overlay.appendChild(wrap);
    overlay.style.display = 'flex';
  }
  function pick(id) {
    if (G.phase !== 'level') return;
    if (id === 'heal') { G.hero.hp = Math.min(G.st.maxHp, G.hero.hp + G.st.maxHp * 0.3); }
    else {
      var old = G.st.maxHp, k = skillOf(id);
      if (k) k.lvl = Math.min(SKILLS[id].txt.length, k.lvl + 1); else G.skills.push({ id: id, lvl: 1, timer: 0, bolts: [] });
      recompute();
      if (G.st.maxHp > old) G.hero.hp += G.st.maxHp - old;
    }
    G.pending--;
    if (G.pending > 0) { G.choices = rollChoices(); renderCards(); }
    else { G.phase = 'play'; overlay.style.display = 'none'; }
  }
  function showResult() {
    var clear = G.phase === 'clear';
    overlay.innerHTML = '<h2>' + (clear ? '스테이지 클리어!' : '패배') + '</h2><p>Lv.' + G.level + ' · 처치 ' + G.kills + '<br>소요 시간 ' + Math.floor(G.t / 60) + '분 ' + Math.floor(G.t % 60) + '초</p>';
    var b = document.createElement('button'); b.className = 'btn'; b.textContent = '다시 하기';
    b.addEventListener('click', start);
    overlay.appendChild(b);
    overlay.style.display = 'flex';
  }

  function start() {
    G = fresh();
    startWave(0);
    overlay.style.display = 'none';
    ETYPES.forEach(function (t) { emesh[t].count = 0; });
    boltMeshes.forEach(function (m) { m.visible = false; });
    blades.forEach(function (m) { m.visible = false; });
    document.getElementById('hint').style.opacity = 1;
  }

  // ---------- render sync ----------
  function renderSync() {
    var h = G.hero;
    heroGroup.position.set(h.x, 0, h.z);
    var counts = { slime: 0, skeleton: 0, brute: 0 }, shc = 0;
    var es = G.enemies;
    for (var i = 0; i < es.length; i++) {
      var e = es[i]; if (e.dead) continue;
      var m = emesh[e.type], idx = counts[e.type];
      if (idx >= CAP) continue;
      counts[e.type]++;
      var s = e.def.scale;
      dummy.position.set(e.x, Math.abs(Math.sin(G.now * 7 + e.ph)) * 0.1, e.z);
      dummy.rotation.set(0, e.ang, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      m.setMatrixAt(idx, dummy.matrix);
      m.setColorAt(idx, e.flash > 0 ? FLASH : WHITE);
      dummy.position.set(e.x, 0.03, e.z); dummy.rotation.set(0, 0, 0); var ss = e.def.r * 2.6; dummy.scale.set(ss, 1, ss); dummy.updateMatrix();
      shadowMesh.setMatrixAt(shc++, dummy.matrix);
    }
    dummy.position.set(h.x, 0.03, h.z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1.5, 1, 1.5); dummy.updateMatrix();
    shadowMesh.setMatrixAt(shc++, dummy.matrix);
    shadowMesh.count = shc; shadowMesh.instanceMatrix.needsUpdate = true;
    ETYPES.forEach(function (t) {
      var m = emesh[t]; m.count = counts[t];
      m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
    });

    var gs = G.gems; var gn = Math.min(gs.length, 500);
    for (var j = 0; j < gn; j++) { dummy.position.set(gs[j].x, 0.3, gs[j].z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); gemMesh.setMatrixAt(j, dummy.matrix); }
    gemMesh.count = gn; gemMesh.instanceMatrix.needsUpdate = true;

    var bk = skillOf('bolt'), bc = 0;
    if (bk) bk.bolts.forEach(function (b) {
      var mesh = boltMeshes[bc];
      if (!mesh) { mesh = makeBolt(); scene.add(mesh); boltMeshes.push(mesh); }
      mesh.visible = true; mesh.position.set(b.x, 0.8, b.z); bc++;
    });
    for (var q = bc; q < boltMeshes.length; q++) boltMeshes[q].visible = false;

    var ok = skillOf('orbit'), oc = 0;
    if (ok && ok.blades) for (var w = 0; w < ORBIT.count[ok.lvl - 1]; w++) {
      var bl = ok.blades[w]; if (!bl) continue;
      var bm = blades[w];
      if (!bm) { bm = new THREE.Mesh(bladeGeo, bladeMat); scene.add(bm); blades[w] = bm; }
      bm.visible = true; bm.position.set(bl.x, 0.8, bl.z); bm.rotation.y = -bl.a; oc++;
    }
    for (var u = oc; u < blades.length; u++) if (blades[u]) blades[u].visible = false;
    orbitRing.visible = !!ok;
    if (ok) orbitRing.position.set(h.x, 0.04, h.z);

    pulseMesh.visible = G.pulseFlash > 0;
    if (pulseMesh.visible) pulseMesh.position.set(h.x, 0.05, h.z);

    // camera
    var k = 1 - Math.exp(-10 * 0.016);
    G.focusX += (h.x - G.focusX) * k; G.focusZ += (h.z - G.focusZ) * k;
    camera.position.set(G.focusX, Math.sin(CFG.pitch) * CFG.dist, G.focusZ + Math.cos(CFG.pitch) * CFG.dist);
    camera.lookAt(G.focusX, 0, G.focusZ);

    // hud
    document.getElementById('xp').style.width = Math.min(100, G.exp / expReq(G.level) * 100) + '%';
    document.getElementById('hp').style.width = Math.max(0, h.hp / G.st.maxHp * 100) + '%';
    document.getElementById('info').textContent = 'Lv.' + G.level + '   처치 ' + G.kills;
    document.getElementById('wave').textContent = '웨이브 ' + (G.wave + 1) + '/' + WAVES.length;
    document.getElementById('wprog').style.width = Math.min(100, G.waveKills / WAVES[G.wave].q * 100) + '%';
    var bn = document.getElementById('banner');
    bn.textContent = G.bannerText;
    bn.style.opacity = G.bannerT > 0 ? 1 : 0;
  }

  // ---------- main loop ----------
  var last = performance.now();
  function update(dt) {
    if (G.phase !== 'play') return;
    G.now += dt; G.t += dt;
    var m = window.__move || readMove(), h = G.hero;
    h.x += m[0] * G.st.move * dt; h.z += m[1] * G.st.move * dt;
    h.x = Math.max(-CFG.bound + 0.6, Math.min(CFG.bound - 0.6, h.x)); h.z = Math.max(-CFG.bound + 0.6, Math.min(CFG.bound - 0.6, h.z));
    if (m[0] * m[0] + m[1] * m[1] > 0.01) h.face = Math.atan2(m[0], m[1]);
    heroVis.rotation.y += (h.face - heroVis.rotation.y) * 0.25;
    h.hp = Math.min(G.st.maxHp, h.hp + 0.5 * dt);
    waveTick(dt);
    enemyTick(dt);
    skillTick(dt);
    gemTick(dt);
    for (var i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].dead) G.enemies.splice(i, 1);
  }

  function frame(nowMs) {
    var dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
    update(dt);
    renderSync();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // test hook for automated checks
  window.__dbg = function () { return G; };
  window.__addExp = function (v) { addExp(v); };
  window.__spawn = function (t) { spawnOne(t); };
  window.__roll = function () { return rollChoices(); };
  window.__step = update;
  window.__pick = function () { if (G.phase === 'level') pick(G.choices[Math.floor(Math.random() * G.choices.length)]); };
  start();
  requestAnimationFrame(frame);
})();
</script>
